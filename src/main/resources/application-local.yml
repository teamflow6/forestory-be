server:
  shutdown: graceful

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000, http://localhost:5173}
    allowed-methods: ${ALLOWED_METHODS:OPTIONS,GET,POST,PUT,PATCH,DELETE}

  cookie:
    max-age: 1234567890
    path: /
    same-site: Lax
    domain: localhost
    secure: false
    http-only: true


  datasource:
    url: jdbc:mysql://localhost:3306/forestory-local-database?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: forestory-local-user
    password: forestory-local-password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_OPTION:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password:
      repositories:
        enabled: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_SECRET_KEY}
            redirect-uri: ${KAKAO_REDIRECT_URI}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiration: ${ACCESS_TOKEN_EXP:987654321}
    refresh-token-expiration: ${REFRESH_TOKEN_EXP:987654321}

  base-uri: http://localhost:8080

firebase:
  account:
    credentials: ${FCM_ACCOUNT_CREDENTIALS}

logging:
  level:
    root: info
