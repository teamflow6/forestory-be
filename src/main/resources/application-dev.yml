server:
  shutdown: graceful

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
    allowed-methods: ${ALLOWED_METHODS}

  cookie:
    max-age: 9876543210
    path: /
    same-site: None
    domain: ${COOKIE_DOMAIN:localhost}
    secure: true
    http-only: true

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql8:3306/sooptory-dev-database?characterEncoding=UTF-8}
    username: ${MYSQL_USER:sooptory-dev-user}
    password: ${MYSQL_PASSWORD:sooptory-dev-password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_OPTION:none}
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      repositories:
        enabled: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_SECRET_KEY}
            redirect-uri: ${KAKAO_REDIRECT_URI}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiration: ${ACCESS_TOKEN_EXP:987654321}
    refresh-token-expiration: ${REFRESH_TOKEN_EXP:987654321}
  login-uri: ${LOGIN_REDIRECT_URI}

firebase:
  account:
    credentials: ${FCM_ACCOUNT_CREDENTIALS}

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  server:
    port: 9000
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_INCLUDE:health,prometheus}
